name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: syntax + autostart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --check (bin/*.mjs)
        shell: bash
        run: |
          set -euo pipefail
          for f in bin/*.mjs; do echo "check $f"; node --check "$f"; done

      - name: bash -n (start/*.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for f in start/*.sh; do echo "check $f"; bash -n "$f"; done

      - name: setup --dry-run exits clean and picks the right autostart
        shell: bash
        run: |
          set -euo pipefail
          out="$(node bin/setup.mjs --dry-run --with-fcc)"
          echo "$out"
          case "${{ runner.os }}" in
            Linux)   echo "$out" | grep -q 'autostart:    systemd' ;;
            macOS)   echo "$out" | grep -q 'autostart:    launchd' ;;
            Windows) echo "$out" | grep -q 'autostart:    startup' ;;
          esac

      - name: generated unit is valid (Linux / systemd)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node bin/setup.mjs --print-autostart gateway > "$RUNNER_TEMP/gw.service"
          node bin/setup.mjs --print-autostart fcc     > "$RUNNER_TEMP/fcc.service"
          cat "$RUNNER_TEMP/gw.service"
          # stdout must be the unit and nothing else, so it can be redirected
          # straight into a file
          head -n1 "$RUNNER_TEMP/gw.service" | grep -qx '\[Unit\]'
          head -n1 "$RUNNER_TEMP/fcc.service" | grep -qx '\[Unit\]'
          ! grep -q 'preflight' "$RUNNER_TEMP/gw.service"
          grep -q '^ExecStart=.*cli\.mjs --port 18900 --no-lan$' "$RUNNER_TEMP/gw.service"
          grep -q '^WantedBy=default\.target$' "$RUNNER_TEMP/gw.service"

      - name: generated agent is valid (macOS / launchd)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node bin/setup.mjs --print-autostart gateway > "$RUNNER_TEMP/gw.plist"
          node bin/setup.mjs --print-autostart fcc     > "$RUNNER_TEMP/fcc.plist"
          cat "$RUNNER_TEMP/gw.plist"
          # stdout must be the plist and nothing else
          head -n1 "$RUNNER_TEMP/gw.plist" | grep -q '^<?xml'
          ! grep -q 'preflight' "$RUNNER_TEMP/gw.plist"
          plutil -lint "$RUNNER_TEMP/gw.plist"
          plutil -lint "$RUNNER_TEMP/fcc.plist"
          grep -q 'com.kobadger.free-model-gateway' "$RUNNER_TEMP/gw.plist"

  verify-helpers:
    name: verify script is importable/parseable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bin/verify-stack.mjs
      - run: node --check bin/sync-models.mjs
      - run: node --check bin/bakeoff.mjs
      - run: node --check bin/render-guide.mjs
      - run: node --check bin/add-fcc-provider.mjs
